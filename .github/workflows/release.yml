# Builds the downloadable app. Pushing a tag like v0.1.0 builds it and attaches
# it to a GitHub Release of that name; running the workflow by hand builds it
# and keeps the result as an artifact of the run, without releasing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # An Apple silicon runner, so the engine and the app are built for arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: The tag must be the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version." >&2
            exit 1
          fi

      - run: npm ci

      # JUCE, FluidSynth and sfizz are fetched and compiled here; kept between runs while the build file is unchanged.
      - uses: actions/cache@v4
        with:
          path: native/build
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/CMakeLists.txt') }}

      - name: Build the audio engine
        run: npm run build:native

      - name: Package the app
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: mtstudio-mac-arm64
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "mtstudio ${GITHUB_REF_NAME#v}" --generate-notes
